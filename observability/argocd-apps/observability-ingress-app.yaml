apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nainakhankar/go-web-app.git
    targetRevision: main
    path: observability/ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
