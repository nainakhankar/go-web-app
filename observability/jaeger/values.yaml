provisionDataStore:
  cassandra: false
  elasticsearch: false

storage:
  type: memory

allInOne:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi

collector:
  enabled: false
query:
  enabled: false
agent:
  enabled: false
